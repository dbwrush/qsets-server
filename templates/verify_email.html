<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirm email - QSets</title>
  <script src="/static/theme.js"></script>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body data-csrf="{{ csrf_token }}">
  {% include "_header.html" %}

  <main>
    <div class="panel login-container">
      <h2>Confirm your email</h2>
      <div id="verify-status" class="login-status">Confirming…</div>
      <form id="resend-form" class="login-form" hidden>
        <p class="card-sub">Need a new link? Enter your email address.</p>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>
        <button type="submit" class="btn-primary login-button">Send a new link</button>
        <div id="resend-status" class="login-status"></div>
      </form>
      <small class="form-hint"><a href="/login">Back to sign in</a></small>
    </div>
  </main>

  <footer class="site-footer">
    <p>Created by <a href="https://dbwrush.com" target="_blank" rel="noopener">David Rush</a> &amp; <a href="https://msparenti.com" target="_blank" rel="noopener">Michael Parenti</a></p>
  </footer>

  <script src="/static/header.js"></script>
  <script src="/static/accounts.js"></script>
</body>
</html>
