<header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="/" aria-label="QSets home">
        <span class="brand-mark" aria-hidden="true">Q</span>
        <span class="brand-name">QSets</span>
      </a>
      <nav class="site-nav" aria-label="Related tools">
        <a href="https://qperf.dbwrush.com" class="nav-link">QPerformance</a>
        <a href="https://qschedule.dbwrush.com" class="nav-link">QuizSchedule</a>
        <a href="https://www.quizstuff.com" class="nav-link">QuizStuff</a>
      </nav>
      <div class="account-nav">
        {% if header.is_authenticated %}
        <div class="user-menu">
          <button type="button" class="user-menu-button" id="user-menu-button" aria-expanded="false" aria-controls="user-menu" aria-label="Account menu for {{ header.username }}">
            <span class="user-avatar" aria-hidden="true">{{ header.initial }}</span>
            <span class="user-name">{{ header.username }}</span>
            <svg class="chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>
          </button>
          <div class="user-menu-panel" id="user-menu" hidden>
            <div class="user-menu-head">Signed in as <strong>{{ header.username }}</strong></div>
            <a class="menu-item" href="/account">Account</a>
            {% if header.can_access_admin %}<a class="menu-item" href="/admin">Admin</a>{% endif %}
            <label class="menu-item theme-switch">
              <span>Dark mode</span>
              <input type="checkbox" id="theme-toggle" role="switch" />
            </label>
            <div class="menu-sep" role="separator"></div>
            <button type="button" class="menu-item menu-danger" id="logout-link">Log out</button>
          </div>
        </div>
        {% else %}
        <button type="button" class="theme-button" id="theme-button" aria-label="Dark mode" aria-pressed="false" title="Dark mode">
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <a href="/login" class="nav-cta">Login</a>
        {% endif %}
      </div>
    </div>
  </header>
