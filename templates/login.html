<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - QSets</title>
  <script src="/static/theme.js"></script>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body data-csrf="{{ csrf_token }}">
  {% include "_header.html" %}

  <main>
    <div class="panel login-container">
      <h2>Sign in</h2>
      <p class="card-sub">Signing in unlocks the pools for your tier.</p>
      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autofocus />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />
        </div>
        <button type="submit" class="btn-primary login-button">Sign in</button>
        <div id="login-status" class="login-status"></div>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <p>Created by <a href="https://dbwrush.com" target="_blank" rel="noopener">David Rush</a> &amp; <a href="https://msparenti.com" target="_blank" rel="noopener">Michael Parenti</a></p>
  </footer>

  <script src="/static/header.js"></script>
  <script src="/static/login.js"></script>
</body>
</html>
