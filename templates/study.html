<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study — QSets</title>
  <script src="/static/theme.js"></script>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/style.css?v=ui-consistency-1" />
</head>
<body data-csrf="{{ csrf_token }}">
  {% include "_header.html" %}
  <main class="study-page">
    <section class="page-intro" id="studyIntro">
      <h1 class="page-title">Study</h1>
    </section>
    <section class="panel" id="studySetup">
      <form id="studySetupForm">
        <div class="form-group"><label for="studyPool">Question pool</label><select id="studyPool" required disabled></select></div>
        <fieldset class="study-fieldset"><legend>Chapters</legend><div id="studyPassages"></div></fieldset>
        <fieldset class="study-fieldset"><legend>Question types</legend><div id="studyTypes" class="options-grid"></div></fieldset>
        <div class="form-group study-count"><label for="studyCount">Questions</label><input id="studyCount" type="number" min="0" step="1" value="20" aria-describedby="studyCountHint" required /><span class="form-hint" id="studyCountHint">0 = all</span></div>
        <p id="studySetupStatus" role="status"></p>
        <button class="btn-primary" id="studyStart" disabled>Start studying</button>
      </form>
    </section>
    <section class="panel" id="studyQuestion" hidden>
      <div class="study-question-bar">
        <p id="studyProgress"></p>
        <p id="studyTimer" role="timer" aria-label="Time remaining"></p>
      </div>
      <p id="studyExpired" class="study-expired" role="status"></p>
      <p id="studyType" class="eyebrow"></p>
      <h2 id="studyPrompt" tabindex="-1"></h2>
      <form id="studyAnswerForm">
        <div class="form-group"><label for="studyAnswer">Your answer</label><textarea id="studyAnswer" rows="4" required></textarea></div>
        <div class="study-actions">
          <button class="btn-primary">Submit</button>
          <button type="button" id="studyReveal">Skip</button>
        </div>
      </form>
      <div id="studyFeedback" hidden>
        <div class="study-feedback-bar">
          <p id="studyAssessment" role="status"></p>
          <p id="studyTiming"></p>
        </div>
        <div class="study-comparison">
          <div class="study-answer-card" id="studySubmittedCard"><h3>Your answer</h3><p id="studySubmitted"></p></div>
          <div class="study-answer-card"><h3>Expected answer</h3><p id="studyExpected"></p><p id="studyReference"></p></div>
        </div>
        <div id="studySelfGrade" class="study-actions" hidden>
          <button type="button" id="studyCorrect">Mark correct</button>
          <button type="button" id="studyIncorrect">Needs practice</button>
        </div>
        <button type="button" id="studyNext" class="btn-primary" hidden>Next question</button>
      </div>
      <button type="button" id="studyFinish" class="btn-ghost">End session</button>
    </section>
    <section class="panel" id="studySummary" hidden>
      <h2 tabindex="-1" id="studySummaryTitle">Session complete</h2>
      <p id="studySummaryText"></p>
      <dl id="studyStats"></dl>
      <div class="study-actions">
        <button type="button" id="studyReview" class="btn-primary">Review missed / late</button>
        <button type="button" id="studyAgain">Study again</button>
      </div>
    </section>
  </main>
  <script src="/static/header.js"></script>
  <script type="module" src="/static/study.js?v=study-30s-1"></script>
</body>
</html>
