<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password - QSets</title>
  <script src="/static/theme.js"></script>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body data-csrf="{{ csrf_token }}">
  {% include "_header.html" %}

  <main>
    <div class="panel login-container">
      <h2>Forgot your password?</h2>
      <p class="card-sub">Enter the email address on your account and we will send you a link to choose a new password.</p>
      <form id="forgot-form" class="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required autofocus />
        </div>
        <button type="submit" class="btn-primary login-button">Send reset link</button>
        <div id="forgot-status" class="login-status"></div>
        <small class="form-hint">Accounts without a confirmed email address cannot be recovered this way; ask an admin. <a href="/login">Back to sign in</a></small>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <p>Created by <a href="https://dbwrush.com" target="_blank" rel="noopener">David Rush</a> &amp; <a href="https://msparenti.com" target="_blank" rel="noopener">Michael Parenti</a></p>
  </footer>

  <script src="/static/header.js"></script>
  <script src="/static/accounts.js"></script>
</body>
</html>
