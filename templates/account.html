<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account - QSets</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body data-csrf="{{ csrf_token }}">
  {% include "_header.html" %}

  <main>
    <div class="panel login-container">
      <h2>Change Password</h2>
      <form id="password-form" class="login-form">
        <div class="form-group">
          <label for="current-password">Current password</label>
          <input type="password" id="current-password" name="current_password" autocomplete="current-password" required />
        </div>
        <div class="form-group">
          <label for="new-password">New password</label>
          <input type="password" id="new-password" name="new_password" autocomplete="new-password" minlength="8" required />
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm new password</label>
          <input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password" minlength="8" required />
        </div>
        <button type="submit" class="login-button">Change Password</button>
        <div id="password-status" class="login-status"></div>
        <small class="form-hint">Changing your password signs you out everywhere else.</small>
      </form>
    </div>
  </main>

  <footer class="footer">
    Created by <a href="https://dbwrush.com" target="_blank">David Rush</a> &amp; <a href="https://msparenti.com" target="_blank">Michael Parenti</a>
  </footer>

  <script src="/static/header.js"></script>
  <script src="/static/account.js"></script>
</body>
</html>
