<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Pool editor — QSets</title>
  <script src="/static/theme.js"></script>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <meta name="theme-color" content="#f3ede2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <script src="/static/pwa.js" defer></script>
  <link rel="stylesheet" href="/static/style.css?v=pool-types-1" />
</head>
<body data-csrf="{{ csrf_token }}">
  {% include "_header.html" %}
  <main class="pool-editor-page">
    <section class="page-intro"><h1 class="page-title" id="editorTitle">Pool editor</h1></section>
    <p id="editorStatus" role="status">Loading...</p>
    <form id="poolEditor" class="panel" hidden>
      <section class="form-section" aria-labelledby="poolDetailsTitle">
        <h2 id="poolDetailsTitle">Pool details</h2>
        <div class="options-grid">
          <div class="form-group"><label for="poolName">Pool name</label><input id="poolName" required /></div>
          <div class="form-group"><label for="poolTier">Visibility / tier</label><select id="poolTier" required></select></div>
        </div>
        <div class="form-group">
          <label for="poolPopup">Pop-up message <span class="hint">(optional)</span></label>
          <textarea id="poolPopup" rows="3" maxlength="2000"></textarea>
          <p class="hint">Shown to anyone who tries to generate sets from, or study, this pool. Leave empty for none.</p>
        </div>
        <div class="form-group">
          <label for="poolPrint">Printed message <span class="hint">(optional)</span></label>
          <textarea id="poolPrint" rows="2" maxlength="500"></textarea>
          <p class="hint">Printed on generated sets and at the top of each set in the downloaded RTF. Leave empty for none.</p>
        </div>
      </section>
      <div class="editor-bar" id="editorBar">
        <div class="editor-bar-row">
          <input id="filterText" type="search" placeholder="Search questions, references, answers" aria-label="Search questions" autocomplete="off" />
          <select id="filterType" aria-label="Filter by type"><option value="">All types</option></select>
        </div>
        <div class="editor-bar-row">
          <span id="questionCount" class="editor-count" role="status"></span>
          <span id="saveStatus" class="editor-save-status" role="status"></span>
          <button type="button" class="btn btn-ghost" id="addQuestion">Add question</button>
          <a class="btn btn-ghost" href="/pools">Back to pools</a>
          <button type="submit" class="btn-primary">Save pool</button>
        </div>
      </div>
      <div id="editorQuestions" class="editor-list"></div>
    </form>
  </main>
  <script src="/static/header.js?v=offline-1"></script>
  <script type="module" src="/static/pool-editor.js?v=scroll-1"></script>
</body>
</html>
