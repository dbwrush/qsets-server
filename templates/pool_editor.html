<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pool editor — QSets</title>
  <script src="/static/theme.js"></script>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/style.css?v=cinematic-6" />
</head>
<body data-csrf="{{ csrf_token }}">
  {% include "_header.html" %}
  <main>
    <section class="page-intro"><h1 class="page-title" id="editorTitle">Pool editor</h1></section>
    <p id="editorStatus" role="status">Loading...</p>
    <form id="poolEditor" class="panel" hidden>
      <fieldset id="editorFields">
        <div class="options-grid">
          <div class="form-group"><label for="poolName">Pool name</label><input id="poolName" required /></div>
          <div class="form-group"><label for="poolTier">Visibility / tier</label><select id="poolTier" required></select></div>
        </div>
        <h2>Questions</h2>
        <div id="editorQuestions"></div>
        <button type="button" id="addQuestion">Add question</button>
        <div class="wizard-nav">
          <a href="/pools">Back to pools</a>
          <button type="submit" class="btn-primary">Save pool</button>
        </div>
      </fieldset>
    </form>
  </main>
  <script src="/static/header.js"></script>
  <script type="module" src="/static/pool-editor.js"></script>
</body>
</html>
